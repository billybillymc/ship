# =============================================================================
# Local development environment for Ship API + FleetGraph Agent
# =============================================================================
# Start the full stack:
#   pnpm docker:up
#
# Services:
#   - PostgreSQL: localhost:5433 (mapped to avoid conflict with local PostgreSQL)
#   - API Server: localhost:3000
#     - Swagger UI: http://localhost:3000/api/docs/
#     - OpenAPI JSON: http://localhost:3000/api/openapi.json
#     - Health check: http://localhost:3000/health
#   - Web Frontend: localhost:5173
#   - FleetGraph Agent: localhost:3001
#     - Health check: http://localhost:3001/health
#
# The API automatically runs migrations and seeds on startup.
# =============================================================================

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ship_dev
      POSTGRES_USER: ship
      POSTGRES_PASSWORD: ship_dev_password
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ship -d ship_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://ship:ship_dev_password@postgres:5432/ship_dev
      SESSION_SECRET: local-dev-session-secret-not-for-production
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_AGENT_URL: http://localhost:3001
    depends_on:
      - api

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      AGENT_PORT: 3001
      SHIP_API_URL: http://api:3000
      SHIP_WS_URL: ws://api:3000
      AGENT_SERVICE_TOKEN: ship_fleetgraph_dev_token_do_not_use_in_prod
      WORKSPACE_ID: ${WORKSPACE_ID:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-true}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-fleetgraph}
    depends_on:
      - api

volumes:
  postgres_data:
